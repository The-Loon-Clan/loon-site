# UI dev loop overlay. Use it explicitly:
#
#   docker compose -f docker-compose.yml -f compose.dev.yml up -d
#
# Templates and static assets are normally compiled into the binary
# (//go:embed web/templates web/static, views.go), which is what lets the
# runtime image be distroless and carry nothing but the binary. The tradeoff is
# that a one-line stylesheet tweak costs a full image rebuild. This overlay
# mounts the working tree and sets LOON_DEV=1, which swaps siteFS to
# os.DirFS(".") and makes render() re-parse per request: edit, refresh, done.
#
# Why a separate file rather than `LOON_DEV: "${LOON_DEV:-}"` in the
# base compose file, which is where this started: that form reads the shell
# environment at compose time, so any later `docker compose up -d` typed without
# the variable silently recreates the container with dev mode OFF. The symptom
# is genuinely confusing — the site keeps serving the assets baked into the
# image while the files on disk say something else, with nothing in the logs to
# explain it. An explicit -f is either present or it isn't.
#
# It also keeps dev mode structurally impossible to enable by accident in a real
# deployment, which a committed .env file would not.

services:
  app:
    environment:
      LOON_DEV: "1"
      # Donations are DEV-ONLY and off unless this is set — the plugin takes
      # real money through BTCPay. Passed through from the shell rather than
      # pinned to "1" so even the dev overlay does not enable payments by
      # accident:
      #   LOON_DONATIONS=1 docker compose -f docker-compose.yml -f compose.dev.yml up -d
      # With it unset the public donate page 404s for non-admins and the admin
      # toggle refuses, whatever the stored setting says.
      LOON_DONATIONS: "${LOON_DONATIONS:-}"
    volumes:
      # Read-only: the site only ever reads these. Mounted at /web because the
      # image sets no WORKDIR, so the binary's os.DirFS(".") resolves from /.
      - ./web:/web:ro
