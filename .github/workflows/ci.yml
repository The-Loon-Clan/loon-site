# Continuous integration.
#
# The job calls `make check`, not its own list of steps, so what runs here is
# exactly what a contributor can run before pushing. A check that lives only in
# a workflow file cannot be tried locally; one that lives only in a Makefile
# does not stop anybody. The same target, both places.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the interesting failures on a small project are not the
  # ones a commit causes — they are a dependency moving, a base image changing,
  # or the Go toolchain deprecating something. Those arrive on their own
  # schedule and are cheapest to find before somebody needs to ship.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # A Postgres for the storage tests. Without one they SKIP, which is right
    # for a laptop and wrong for CI: the bug they exist for — struct tags that
    # stopped matching their columns — is invisible until a statement actually
    # runs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: loon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

      # A Redis, for the same reason. The cache backend chooses between Redis
      # and an in-process map at boot, and the branch worth checking is that a
      # cache calling itself Redis really is Redis — a memory cache under that
      # name is invisible on one process and serves two different versions of
      # every cached page across two.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      LOON_TEST_DSN: postgres://demo:demo@localhost:5432/loon_test?sslmode=disable
      # REDIS_TEST_ADDR, not REDIS_ADDR: the latter is the operator's switch and
      # is set in every compose file here, so reusing it would have the test
      # quietly exercise whatever Redis happened to be running.
      REDIS_TEST_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # No go.work here, and none is created. CI must see what a clone sees:
      # the module versions in go.mod, not somebody's sibling checkouts.
      - name: Verify a clone builds on its own
        run: |
          test ! -f go.work || { echo "go.work is committed; it must not be"; exit 1; }
          go build ./...

      # go.mod and go.sum must already be what `go mod tidy` produces. A stray
      # requirement or a missing sum is invisible until somebody clones fresh —
      # the local module cache papers over both, so it fails for the newcomer
      # and nobody else.
      - name: go.mod is tidy
        run: |
          cp go.mod /tmp/go.mod.bak; cp go.sum /tmp/go.sum.bak
          go mod tidy
          diff -u /tmp/go.mod.bak go.mod && diff -u /tmp/go.sum.bak go.sum || {
            echo "go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result"
            exit 1
          }
        env:
          GOWORK: "off"

      # Installed rather than run as its own step: scripts/golangci.sh prefers a
      # golangci-lint on PATH, so putting one there is enough for `make check`
      # to use it, and CI keeps running exactly the target a contributor runs.
      #
      # Built from source instead of pulling a release, because the published
      # binaries are built against an older toolchain and refuse a newer target
      # outright ("the Go language version used to build golangci-lint is lower
      # than the targeted Go version").
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      # GO=go: CI is already a clean Linux container, so running the toolchain
      # inside another one buys nothing here. The Docker path exists for
      # developer machines where an anti-virus quarantines freshly built
      # binaries; the checks themselves are identical either way.
      - name: Checks
        run: make check GO=go

      - name: Known vulnerabilities in code we call
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Coverage summary
        if: always()
        run: |
          go tool cover -func=coverage.out > /tmp/cover.txt || exit 0
          {
            echo "### Test coverage"
            echo
            echo '```'
            tail -1 /tmp/cover.txt
            echo '```'
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            sort -k3 -r /tmp/cover.txt | head -40
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # The claim the README makes — clone it, run one command, get a site — is
  # worth testing, because it is the first thing a stranger does and the
  # easiest thing to break without noticing. Everything above this point can
  # pass while `docker compose up` fails for want of a sibling checkout.
  out-of-the-box:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up, from nothing
        run: docker compose up -d --build

      - name: The site answers, and its schema is there
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/ || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200" || { echo "site did not come up"; docker compose logs app | tail -40; exit 1; }
          # A first boot that logs errors is not a working first boot, whatever
          # the home page returns — this is how the site_settings migration
          # being hidden behind a feature flag was found.
          errs=$(docker compose logs app | grep -c 'level=ERROR' || true)
          test "$errs" = "0" || { echo "$errs error(s) on first boot"; docker compose logs app | grep 'level=ERROR' | head; exit 1; }
          echo "first boot clean, HTTP 200"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
