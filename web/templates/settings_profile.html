{{/* About you — the profile's free-text block. Data from profilebio_web.go:
     .Bio (raw markdown), .Editor (the site's prose editor, pre-rendered),
     .Max, .Saved.

     The editor comes from the host's shared partial rather than a bare
     <textarea>, so this field gets the same toolbar and the same markdown as
     the forum and the wiki. */}}
{{define "content"}}
<header>
    <h1 class="h3 m-0">About you</h1>
    <p class="text-muted small m-0 mt-1">Anything you want on your profile. Markdown, the same as the forum.</p>
</header>

{{with .Undone}}
<div class="notice {{if eq . "1"}}notice--success{{else}}notice--danger{{end}}">
    <svg class="icon notice__icon" aria-hidden="true"><use href="#info"></use></svg>
    <span>{{if eq . "1"}}Put back.{{else}}That can no longer be undone.{{end}}</span>
</div>
{{end}}

{{if .Saved}}
{{/* Two shapes for one event: with an undo token the offer replaces the plain
     notice, so there is one message rather than a confirmation and an offer
     stacked on top of each other. */}}
{{if .UndoToken}}
{{template "undo-offer" dict "Token" .UndoToken "Next" "/settings/profile" "CSRF" .CSRFToken "Text" "Saved. Your previous profile text was replaced."}}
{{else}}
<div class="notice notice--success">
    <svg class="icon notice__icon" aria-hidden="true"><use href="#check"></use></svg>
    <span>Saved.{{with .User}} <a href="/u/{{.Username}}">View your profile</a>.{{end}}</span>
</div>
{{end}}
{{end}}

{{if .AvatarErr}}
<div class="notice notice--danger">
    <svg class="icon notice__icon" aria-hidden="true"><use href="#info"></use></svg>
    <span>{{.AvatarErr}}</span>
</div>
{{end}}
{{if .AvatarSaved}}
<div class="notice notice--success">
    <svg class="icon notice__icon" aria-hidden="true"><use href="#check"></use></svg>
    <span>Avatar updated.</span>
</div>
{{end}}
{{if .AvatarGone}}
{{if .UndoToken}}
{{template "undo-offer" dict "Token" .UndoToken "Next" "/settings/profile" "CSRF" .CSRFToken "Text" "Avatar removed."}}
{{else}}
<div class="notice notice--success">
    <svg class="icon notice__icon" aria-hidden="true"><use href="#check"></use></svg>
    <span>Avatar removed.</span>
</div>
{{end}}
{{end}}

{{/* Avatar. A SEPARATE form from the prose below, and separate status keys:
     one form would re-post the image on every text save, and "Remove" would
     have to be told apart from "Save" by a hidden field. */}}
<section class="panelV2">
    <header class="panel__header">
        <h2 class="panel__heading">
            <svg class="icon panel__heading-icon" aria-hidden="true"><use href="#image"></use></svg>
            Your avatar
        </h2>
    </header>
    <div class="panel__body">
        <div class="avatar-setting">
            {{/* The current state, at the size the profile shows it. Shown
                 whether or not one is set, because the initials tile IS what
                 other members see and this page should not imply otherwise. */}}
            {{template "avatar" dict "Path" .Avatar "Name" .Username "Size" "lg" "Px" 128}}
            <div class="avatar-setting__body">
                <form class="form" method="post" action="/settings/avatar" enctype="multipart/form-data">
                    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
                    <div class="form__group">
                        <label class="form__label" for="avatar">Choose an image</label>
                        <input class="form__input" id="avatar" type="file" name="avatar"
                               accept="image/jpeg,image/png,image/gif,image/webp"
                               aria-describedby="avatar-help">
                        <p class="form__help mt-1 mb-0" id="avatar-help">
                            JPEG, PNG, GIF or WebP, up to {{.AvatarMaxMB}} MB. It is cropped to a
                            square and stored at {{.AvatarPixels}}&times;{{.AvatarPixels}}.
                        </p>
                    </div>
                    <div class="form__actions">
                        <button class="button button--primary" type="submit">Upload</button>
                    </div>
                </form>
                {{if .Avatar}}
                {{/* Its own form so it is a POST, not a link — a GET that
                     deletes is one crawler away from deleting itself. */}}
                <form method="post" action="/settings/avatar" class="mt-2">
                    <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
                    <input type="hidden" name="remove" value="1">
                    <button class="button button--outlined" type="submit">Remove avatar</button>
                </form>
                {{end}}
            </div>
        </div>
    </div>
</section>

<section class="panelV2">
    <header class="panel__header">
        <h2 class="panel__heading">
            <svg class="icon panel__heading-icon" aria-hidden="true"><use href="#user"></use></svg>
            Your profile text
        </h2>
    </header>
    <div class="panel__body">
        <form class="form" method="post" action="/settings/profile">
            <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
            {{/* The shared editor renders its own <textarea name="bio">. */}}
            {{.Editor}}
            <p class="text-muted small m-0 mt-2">Up to {{.Max}} characters. Leave it empty to show nothing.</p>
            <div class="form__actions mt-3">
                <button class="button button--primary" type="submit">Save</button>
                {{/* Guarded: the handler login-gates this page, but a template
                     must still render for a logged-out dot — an execute error
                     truncates the page and still returns 200. */}}
                {{with .User}}<a class="button button--outlined" href="/u/{{.Username}}">Cancel</a>{{end}}
            </div>
        </form>
    </div>
</section>
{{end}}
