services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: loon_demo
    # Docker gives a container 64 MB of /dev/shm, which is where Postgres puts
    # the DSM segments its PARALLEL workers share. The usenet staging table runs
    # to millions of rows, and at that size a plain `VACUUM (ANALYZE)` picks a
    # parallel plan and dies on "could not resize shared memory segment ... No
    # space left on device" — so the table never gets analyzed, pg_class
    # reltuples drifts far above the real row count, and the crawler's staging
    # pressure gauge (staged rows / staging_max_rows, off reltuples) reads full
    # and pauses the crawl on a table that is 68% full. Nothing in the logs
    # points at /dev/shm.
    shm_size: 1gb
    ports:
      - "5544:5432"

  redis:
    image: redis:7-alpine
    # NOT the usenet staging backend by default — USENET_STAGING below is "pg",
    # so this holds the page cache and core.Redis only, which is why it sits at
    # ~1 MB used with maxmemory unset (i.e. unlimited). A staging stall is a
    # Postgres story, not a Redis one; check `select reltuples from pg_class`
    # against the real count before reaching for memory here.
    ports:
      - "6399:6379"

  app:
    build:
      context: .
      # loon + loon-plugins + loon-baseline are sibling checkouts the go.mod
      # replaces point at; supply them to the build as named contexts (requires
      # BuildKit, default in modern Docker). See Dockerfile.
      additional_contexts:
        loon: ../loon
        loonplugins: ../loon-plugins
        loonbaseline: ../loon-baseline
    environment:
      # talk to the db service over the compose network, not the published port
      LOON_DEMO_DSN: "postgres://demo:demo@db:5432/loon_demo?sslmode=disable"
      # Page cache backend AND core.Redis (the seam Redis-capable plugins use).
      # Unset -> in-memory cache + core.Redis nil; set -> the redis impl for both.
      REDIS_ADDR: "${REDIS_ADDR-redis:6379}"
      # Usenet staging backend: pg (durable, default) | redis (prod's assembly
      # pipeline). redis requires REDIS_ADDR above — with it empty the usenet
      # plugin fails to boot rather than silently running pg.
      #   USENET_STAGING=redis docker compose up --build -d
      USENET_STAGING: "${USENET_STAGING:-pg}"
      # Metadata-source credentials (optional — set on the host to enable a source):
      #   TPDB_API_KEY = ThePornDB bearer token (xxx)   ANIDB_CLIENT = registered AniDB client name (anime)
      TPDB_API_KEY: "${TPDB_API_KEY:-}"
      ANIDB_CLIENT: "${ANIDB_CLIENT:-}"
      # Cloudflare Turnstile (optional). Unset = captcha disabled. Cloudflare's
      # public test keys are handy here: sitekey 1x00000000000000000000AA +
      # secret 1x0000000000000000000000000000000AA (always pass) or secret
      # 2x0000000000000000000000000000000AA (always fail).
      TURNSTILE_SITEKEY: "${TURNSTILE_SITEKEY:-}"
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
      # The UI dev loop (edit web/, refresh, no rebuild) lives in
      # compose.dev.yml, NOT here — see that file for why.
    ports:
      - "8090:8090"
    volumes:
      # User-uploaded images (wiki, community banners and icons, avatars) are
      # written to /data by blob.NewLocal(uploadRoot, uploadURL) and served from
      # there. Without a volume that directory lives in the container layer, so
      # every `up --build` silently discarded every upload ever made and left
      # the database rows pointing at files that no longer existed -- a broken
      # image on each affected page, and nothing in the logs.
      - uploads:/data
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  # Named rather than a bind mount: the uploads belong to the deployment, not
  # to the checkout, and a bind mount would put user content inside the repo.
  uploads:
