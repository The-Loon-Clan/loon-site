services:
  db:
    image: postgres:16-alpine
    volumes:
      # The DATABASE needs a named volume for the same reason /data does, and
      # not having one cost a real index: postgres declares its own VOLUME, so
      # compose gave it an ANONYMOUS one, and `docker compose down` orphaned
      # that and the next `up` initialised an empty cluster. 56,331 releases,
      # 4.6M staged articles and the configured NNTP server went with it.
      #
      # Anonymous is the trap: the data looks persistent across `up`/`restart`
      # and vanishes on the one command nobody thinks of as destructive. Named,
      # it survives `down` and only `down -v` removes it -- which is a flag you
      # have to mean.
      - dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: loon_demo
    # Docker gives a container 64 MB of /dev/shm, which is where Postgres puts
    # the DSM segments its PARALLEL workers share. The usenet staging table runs
    # to millions of rows, and at that size a plain `VACUUM (ANALYZE)` picks a
    # parallel plan and dies on "could not resize shared memory segment ... No
    # space left on device" — so the table never gets analyzed, pg_class
    # reltuples drifts far above the real row count, and the crawler's staging
    # pressure gauge (staged rows / staging_max_rows, off reltuples) reads full
    # and pauses the crawl on a table that is 68% full. Nothing in the logs
    # points at /dev/shm.
    shm_size: 1gb
    ports:
      - "5544:5432"

  redis:
    image: redis:7-alpine
    # NOT the usenet staging backend by default — USENET_STAGING below is "pg",
    # so this holds the page cache and core.Redis only, which is why it sits at
    # ~1 MB used with maxmemory unset (i.e. unlimited). A staging stall is a
    # Postgres story, not a Redis one; check `select reltuples from pg_class`
    # against the real count before reaching for memory here.
    ports:
      - "6399:6379"

  app:
    build:
      context: .
      # loon + loon-plugins + loon-baseline are sibling checkouts the go.mod
      # replaces point at; supply them to the build as named contexts (requires
      # BuildKit, default in modern Docker). See Dockerfile.
      additional_contexts:
        loon: ../loon
        loonplugins: ../loon-plugins
        loonbaseline: ../loon-baseline
    environment:
      # talk to the db service over the compose network, not the published port
      LOON_DEMO_DSN: "postgres://demo:demo@db:5432/loon_demo?sslmode=disable"
      # Page cache backend AND core.Redis (the seam Redis-capable plugins use).
      # Unset -> in-memory cache + core.Redis nil; set -> the redis impl for both.
      REDIS_ADDR: "${REDIS_ADDR-redis:6379}"
      # Usenet staging backend: pg (durable, default) | redis (prod's assembly
      # pipeline). redis requires REDIS_ADDR above — with it empty the usenet
      # plugin fails to boot rather than silently running pg.
      #   USENET_STAGING=redis docker compose up --build -d
      USENET_STAGING: "${USENET_STAGING:-pg}"
      # The BitTorrent tracker, OFF by default. It publishes announce endpoints,
      # mints passkeys and starts keeping ratio accounting the moment it is
      # reachable, so it is the one plugin here that must be asked for:
      #   LOON_DEMO_TRACKER=1 docker compose up --build -d
      LOON_DEMO_TRACKER: "${LOON_DEMO_TRACKER:-}"
      # The absolute base baked into every downloaded .torrent. A wrong value
      # does not fail loudly — it produces torrents pointing somewhere unable to
      # answer, and the member finds out when their client calls the tracker
      # dead. Defaults to the address this demo actually serves on.
      LOON_DEMO_SITE_URL: "${LOON_DEMO_SITE_URL:-}"
      # Hit-and-run rules over the tracker's accounting. OFF by default for the
      # same reason the tracker is: this one disables members' downloads.
      # Warnings still EXPIRE when it is off — turning the rules off must not
      # freeze every warning already on the record in place forever.
      #   LOON_DEMO_TRACKER=1 LOON_DEMO_HITRUN=1 docker compose up --build -d
      LOON_DEMO_HITRUN: "${LOON_DEMO_HITRUN:-}"
      # One host per torrent per member — the anti-cheat for a member seeding
      # the same torrent from several machines and being credited by all of
      # them. OFF by default, and it needs REDIS_ADDR: a claim must be shared
      # across the web and api processes, which both serve announce.
      #   LOON_DEMO_TRACKER=1 LOON_DEMO_SEEDLOCK=1 docker compose up --build -d
      LOON_DEMO_SEEDLOCK: "${LOON_DEMO_SEEDLOCK:-}"
      # Metadata-source credentials (optional — set on the host to enable a source).
      # Every source main.go reads must be listed here: an unlisted variable is
      # simply absent inside the container, so the source registers as "not
      # configured" no matter what the operator sets. TMDB_API_KEY was read by
      # main.go and missing from this list, which is why cover art for movies
      # and TV could never appear.
      #   TMDB_API_KEY  = themoviedb.org v3 key  (movie + tv posters/backdrops)
      #   TPDB_API_KEY  = ThePornDB bearer token (xxx)
      #   ANIDB_CLIENT  = registered AniDB client name (anime)
      # Open Library (books) needs no credential and is always on.
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      TPDB_API_KEY: "${TPDB_API_KEY:-}"
      ANIDB_CLIENT: "${ANIDB_CLIENT:-}"
      # Cloudflare Turnstile (optional). Unset = captcha disabled. Cloudflare's
      # public test keys are handy here: sitekey 1x00000000000000000000AA +
      # secret 1x0000000000000000000000000000000AA (always pass) or secret
      # 2x0000000000000000000000000000000AA (always fail).
      TURNSTILE_SITEKEY: "${TURNSTILE_SITEKEY:-}"
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
      # The UI dev loop (edit web/, refresh, no rebuild) lives in
      # compose.dev.yml, NOT here — see that file for why.
    ports:
      - "8090:8090"
    volumes:
      # User-uploaded images (wiki, community banners and icons, avatars) are
      # written to /data by blob.NewLocal(uploadRoot, uploadURL) and served from
      # there. Without a volume that directory lives in the container layer, so
      # every `up --build` silently discarded every upload ever made and left
      # the database rows pointing at files that no longer existed -- a broken
      # image on each affected page, and nothing in the logs.
      - uploads:/data
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  # Named rather than a bind mount: the uploads belong to the deployment, not
  # to the checkout, and a bind mount would put user content inside the repo.
  uploads:
  # An explicit name, not the compose-generated one. It holds an index that was
  # crawled over days and cannot be regenerated without re-crawling, so it
  # should be recognisable in `docker volume ls` and hard to delete by accident
  # while clearing up a project prefix.
  dbdata:
    name: loon_demo_db
