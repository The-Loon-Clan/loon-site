# nginx in front of several app replicas.
#
# The site can run behind a load balancer at all because sessions live in Redis
# when REDIS_ADDR is set, which compose sets by default. Nothing is held in a
# process, so any replica can answer any request and no sticky-session rule is
# needed. Turn Redis off and this stops working — a member would be signed in
# on one replica and signed out on the next.

worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;
	sendfile      on;
	keepalive_timeout 65;

	# Log the client address as the app will see it, so a line here and a row in
	# login_logs can be compared when they disagree.
	log_format  upstream '$remote_addr -> $upstream_addr "$request" '
	                     '$status $body_bytes_sent "$http_user_agent"';
	access_log /var/log/nginx/access.log upstream;

	server {
		# 8090 rather than 80, so every URL in the README stays correct and the
		# single-container and load-balanced setups are reached the same way.
		listen 8090;
		server_name _;

		# Uploads: the wiki, avatars and community banners post images.
		client_max_body_size 25m;

		# Docker's embedded DNS. This is the part that makes `--scale app=3`
		# work, and it is not obvious: a static `upstream { server app:8090; }`
		# block resolves the name ONCE at start-up, so nginx keeps talking to
		# whichever replicas existed then and never discovers a new one. Scaling
		# up appears to do nothing, scaling down produces 502s for a container
		# that is gone, and nothing in either log says the word DNS.
		#
		# Putting the address in a variable forces a lookup per request, honouring
		# the record's TTL. Docker returns every replica's address for the service
		# name, in rotating order, which is the load balancing.
		resolver 127.0.0.11 valid=10s ipv6=off;

		location / {
			set $app http://app:8090;
			proxy_pass $app;

			proxy_set_header Host              $host;
			proxy_set_header X-Real-IP         $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# X-Forwarded-For is only worth anything if the app is told to
			# believe THIS proxy and no one else — see LOON_TRUSTED_PROXIES in
			# compose.lb.yml. gin trusts every proxy by default, which means a
			# client can hand it any address it likes and have that recorded as
			# its own in the login history.
			proxy_http_version 1.1;
			proxy_set_header Connection "";

			proxy_connect_timeout 5s;
			proxy_read_timeout    60s;
		}

		# The liveness endpoint is registered before any middleware and answers
		# even in maintenance mode, so it reports whether the PROCESS is up
		# rather than whether the site is currently serving members.
		location = /healthz {
			set $health http://app:8090;
			proxy_pass $health;
			access_log off;
		}
	}
}
